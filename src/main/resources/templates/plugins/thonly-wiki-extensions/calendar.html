<!DOCTYPE html>
<!-- 独立页 /calendar —— 对应线上 thonly.cc/calendar/ 的整页活动日历（无 wiki 布局、无 iframe）：
     本地原生活动日历 + 本站活动表数据 -->
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${pageTitle}">东方Project线下活动日程信息</title>
    <link rel="stylesheet" th:href="@{/plugins/thonly-wiki-extensions/activity-calendar.css}"/>
    <meta name="robots" content="noindex"/>
</head>
<body class="thonly-calendar-page">
<div class="thonly-calendar-shell">
    <div class="thonly-calendar-head">
        <h1 th:text="${pageTitle}">东方Project线下活动日程信息</h1>
        <p>
            <a th:href="@{/wiki/活动日历}">在 wiki 中查看</a>
            <span class="thonly-calendar-sep">·</span>
            <a th:href="${scheduleUrl}">线下活动速查表</a>
            <span class="thonly-calendar-sep">·</span>
            <a th:href="@{/excel/}">活动表格（独立页）</a>
        </p>
    </div>
    <div class="thonly-calendar-app">
        <div class="touhou-calendar" data-touhou-calendar="1"></div>
    </div>
</div>
<script th:src="@{/plugins/thonly-wiki-extensions/activity-calendar.js}"></script>
</body>
</html>
